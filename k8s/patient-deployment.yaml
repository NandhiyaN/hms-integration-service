apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient
  template:
    metadata:
      labels:
        app: patient
    spec:
      containers:
        - name: patient
          image: hms-integration-compose-patient-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001