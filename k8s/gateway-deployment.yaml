apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hms-integration-service-gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          env:
            - name: PATIENT_SERVICE_URL
              value: http://patient-service:9001/v1
            - name: BILLING_SERVICE_URL
              value: http://billing-service:9005/v1